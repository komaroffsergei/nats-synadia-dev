stages:
  - first
  - deploy

.build_block: &build_block
  stage: first
  tags: [deploy]
  needs: [ ]
  image: docker:27.5.1
  script:
    - export CI_COMMIT_TAG="${CI_COMMIT_TAG:-0.0.0}"
    - export CI_SKIP_PUSH="${CI_SKIP_PUSH:-true}"
    - docker run --rm `env | grep -o '^CI_[^=]*' | sed 's/^/-e /'`
      -v /var/run/docker.sock:/var/run/docker.sock
      -v /root/.docker:/root/.docker
      $(docker build -q -t build/${CI_PROJECT_NAME} -f docker/Dockerfile.build .) 2>&1

build push:
  <<: *build_block

deploy:
  stage: deploy
  tags: [deploy]
  image: docker:27.5.1
  script:
    - docker build -t deploy/${CI_PROJECT_NAME} -f stack/Dockerfile.deploy .
    - docker run --rm --env-file <(env | grep -E '^CI_') -e DEPLOY_CONTEXT_ENDPOINT -e GIS_MASTER_SSH_PRIVATE_KEY_B64 -e DEPLOY_SSH_PRIVATE_KEY_B64 -e GIS_MASTER_SSH_PRIVATE_KEY -e DEPLOY_SSH_PRIVATE_KEY -e SSH_PRIVATE_KEY -e CI_SSH_PRIVATE_KEY -e DEPLOY_LOCAL_IMAGE=true -e APP_IMAGE -e REGISTRY_HOST -e REGISTRY_USER -e REGISTRY_PASSWORD -e GHCR_USER -e GHCR_TOKEN -e NATS_URL -e NATS_URLS_JSON -e NATS_EXTERNAL_NETWORK -e YOUTRACK_BASE_URL -e YOUTRACK_OWNER -e YOUTRACK_AGENT_NAME -e YOUTRACK_TOKEN -e YOUTRACK_WEBHOOK_TOKEN -e YOUTRACK_WEBHOOK_PORT -e YOUTRACK_CODEX_SESSION_FIELD -e YOUTRACK_AGENT_MESSAGE_SUBJECT -e YOUTRACK_PUBLIC_WEBHOOK_URL -e OPENAI_API_KEY -e CODEX_API_KEY -e CODEX_BASE_URL -e CODEX_MODEL -e CODEX_REASONING_EFFORT -e CODEX_WORKER_CONCURRENCY -e CODEX_DRY_RUN -e CODEX_SANDBOX_MODE -e CODEX_APPROVAL_POLICY -e CODEX_NETWORK_ACCESS -e CODEX_WEB_SEARCH -e YT_CODEX_STREAM -e YT_CODEX_JOB_SUBJECT -e YT_CODEX_RESULT_SUBJECT -v /var/run/docker.sock:/var/run/docker.sock -v /root/.docker:/root/.docker -v ssh-agent-socket:/run/ssh-agent:ro deploy/${CI_PROJECT_NAME}
