stages:
  - first
  - deploy

.build_block: &build_block
  stage: first
  tags: [ build ]
  needs: [ ]
  image: docker:27.5.1
  script:
    - export CI_COMMIT_TAG="${CI_COMMIT_TAG:-0.0.0}"
    - docker run --rm `env | grep -o '^CI_[^=]*' | sed 's/^/-e /'`
      -v /var/run/docker.sock:/var/run/docker.sock
      -v /root/.docker:/root/.docker
      $(docker build -q -t build/${CI_PROJECT_NAME} -f docker/Dockerfile.build .) 2>&1

build push:
  <<: *build_block

deploy:
  stage: deploy
  tags: [deploy]
  image: docker:27.5.1
  script:
    - docker build -t deploy/${CI_PROJECT_NAME} -f stack/Dockerfile.deploy stack
    - docker run --rm --env-file <(env | grep -E '^CI_') -e DEPLOY_CONTEXT_ENDPOINT -e GIS_MASTER_SSH_PRIVATE_KEY_B64 -e DEPLOY_SSH_PRIVATE_KEY_B64 -e GIS_MASTER_SSH_PRIVATE_KEY -e DEPLOY_SSH_PRIVATE_KEY -e SSH_PRIVATE_KEY -e CI_SSH_PRIVATE_KEY -e NATS_URL -e NATS_SERVERS -e NATS_SERVICE_URL -e NATS_CONNECTIONS -e NATS_CONNECTIONS_JSON -e NATS_EXTERNAL_NETWORK -e START_BASIC_AGENTS -v /var/run/docker.sock:/var/run/docker.sock -v /root/.docker:/root/.docker -v ssh-agent-socket:/run/ssh-agent:ro deploy/${CI_PROJECT_NAME}
