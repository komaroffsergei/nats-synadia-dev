port: 4222
server_name: youtrack-codex-local

jetstream {
  store_dir: ".runtime/nats/jetstream"
}

# Browser -> Synadia Bun bridge /ws -> NATS TCP 4222.
# WebSocket listener оставлен как дополнительный вход для отладки,
# но штатный UI говорит с NATS через server-side Bun bridge.
websocket {
  port: 8080
  no_tls: true
}
