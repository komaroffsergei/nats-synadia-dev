port: 4222
server_name: basic-local

# Основной путь проекта теперь такой:
# Browser -> Synadia Bun bridge /ws -> NATS TCP 4222.
# WebSocket listener оставлен как полезный дополнительный вход для отладки
# и любых browser-side NATS клиентов, но Synadia agent-web-ui напрямую
# к нему не подключается.
websocket {
  port: 8080
  no_tls: true
}
